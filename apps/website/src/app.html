<!doctype html>
<!--
  Orthogonal intents (2026-09-06): [official-site] OpenIWeb 官网 HTML 壳；
  [brand-assets] theme-color / favicon 携带项目图标色 #008bff（logo 蓝
  #0b81fd 的渲染近似，proposal 裁定；与 skill 的“暗色画布 #000000”建议
  不同，见包内 NOTES.md）；
  [no-flash] 首绘前同步引导主题（localStorage theme + prefers-color-scheme
  → html.dark + colorScheme），并打上 html.js 存活标记（jixoai 表面族的
  no-JS 回退分支仍以它为门）；
  [site-i18n] (2026-09-06) lang 为占位符属性，由 src/hooks.server.ts
  按 route（/zh → zh，其余 → en）在解析期替换（预渲染产物直接落正确值）；
  [locale-negotiation] (2026-09-06) 首帧前的语言协商——zh 偏好访问者落在
  默认（en）面时，同路径同 hash 一次性 replace 到 /zh/ 镜像；显式选择
  （localStorage lang，由切换器写入）优先于浏览器语言检测。检测只在
  默认面发生，非默认面永不跳转（结构上防环：跳转目标必带 /zh/ 前缀）。
  [rename-openiweb] (2026-09-07, Owner): 品牌词 iweb → OpenIWeb（仅措辞，
  壳结构不变）。

  Original request (2026-09-06, Asia/Shanghai): 新增 ./openiweb 官网站点。
-->
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008bff" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      (() => {
        // 语言协商，首帧前执行（openspec change 2026-09-06-locale-negotiation）：
        // zh 偏好访问者落在默认（en）面时，同路径 + 同 hash 一次性 replace
        // 到 /zh/ 镜像（location.replace 不留历史）。优先级：显式选择
        // （localStorage lang，由根布局的切换器写入）> navigator.languages
        // 逐项取主子标签的首个命中（zh-CN/zh-Hans → zh）。
        // 结构性防环：脚本只从默认面跳走、目标必带 /zh/ 前缀（条件不再
        // 成立）、绝无从 /zh/ 跳回。
        const siteBase = "%site_base%"; // 构建期由 hooks.server.ts 按 kit.paths.base 同源 env 烘焙
        const path = window.location.pathname;
        const route =
          siteBase !== "" && `${path}/`.startsWith(`${siteBase}/`)
            ? path.slice(siteBase.length) || "/"
            : path;
        if (/^\/zh(?:\/|$)/.test(route)) return; // 已在 zh 面——永不跳转
        const negotiate = () => {
          try {
            const stored = window.localStorage.getItem("lang");
            if (stored === "zh" || stored === "en") return stored; // 显式选择永远压过检测
          } catch {
            /* storage 不可用 → 落入浏览器检测 */
          }
          const langs = navigator.languages ?? (navigator.language ? [navigator.language] : []);
          for (const tag of langs) {
            const primary = String(tag).split("-")[0].toLowerCase();
            if (primary === "zh") return "zh";
            if (primary === "en") return "en"; // 默认面已是 en——首个命中即定
          }
          return null;
        };
        if (negotiate() === "zh") {
          window.location.replace(
            `${siteBase}/zh${route === "/" ? "/" : route}${window.location.hash}`,
          );
        }
      })();
    </script>
    <script>
      (() => {
        // No-flash theme bootstrap + the html.js liveness flag（reveal 已是
        // 滚动驱动 CSS，但表面族的 no-JS 回退仍门控在 html:not(.js) 上）。
        const root = document.documentElement;
        root.classList.add("js");
        const isTheme = (value) => value === "light" || value === "dark" || value === "system";
        let theme = "system";
        try {
          const stored = window.localStorage.getItem("theme");
          if (isTheme(stored)) theme = stored;
        } catch {
          theme = "system";
        }
        const prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.classList.toggle("dark", theme === "dark" || (theme === "system" && prefersDark));
        root.style.colorScheme = root.classList.contains("dark") ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
